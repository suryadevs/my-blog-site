{{- $width := .Get "width" | default "50%" -}}
<figure{{ with .Get "class" }} class="{{ . }}"{{ end }}>
  <img src="{{ .Get "src" | safeURL }}"
       alt="{{ .Get "alt" }}"
       style="width: {{ $width }}; max-width: 100%; height: auto;">
  {{- with .Get "caption" }}
    <figcaption>{{ . | markdownify }}</figcaption>
  {{- end }}
</figure>
